[project]
name = "fieldguide-process-insights"
version = "0.1.0"
description = "Evidence-first industrial operations assistant prototype"
requires-python = ">=3.11,<3.15"
dependencies = [
  "google-adk==2.8.0",
  "a2ui-agent-sdk==0.5.0",
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "pydantic==2.13.5",
  "python-dotenv==1.1.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
